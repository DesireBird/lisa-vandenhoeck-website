# Netlify-Site „vandenhoeck.de“. Phase 1: die bestehende statische Seite 1:1, ohne Build.
# Später (Phase 3) kommt wie bei Paw Holidays base = "web" mit Next.js-Export dazu.
# Bis zum Domain-Umzug deployt parallel weiterhin die GitHub Action per FTP zu All-Inkl.
[build]
  publish = "."
  command = ""

# Bilder, Fonts, CSS und JS haben keinen Hash im Namen: einen Tag cachen, dann neu prüfen.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sicherheits-Header für alle Seiten (gleiche Basis wie Paw Holidays).
# CSP: eine Seite hat ein Inline-Skript, einige Elemente Inline-Styles → 'unsafe-inline'.
# Calendly ist nur verlinkt, nicht eingebettet. frame-src app.netlify.com: Toolbar in Deploy Previews.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://app.netlify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Interne Dateien nicht ausliefern.
[[redirects]]
  from = "/.github/*"
  to = "/404"
  status = 404
  force = true
