# Netlify-Site „vandenhoeck.de“ (Aufbau wie Paw Holidays). Liegt im Repo-Root, damit in der
# Netlify-Oberfläche kein Base directory gesetzt werden muss. Pfade unter [build] sind relativ zu base.
# Live-Site: Umgebungsvariable SITE_ENV=production setzen. Ohne sie (Staging, Previews) → noindex.
# Production branch = live, main = Staging (Branch-Deploy, kostet keine Credits).
[build]
  base = "web"
  command = "npm run build"
  publish = "out"
  # Build überspringen nur, wenn sich nichts geändert hat, was in die Seite einfließt.
  # Standard bei Monorepos prüft nur web/ – Tokens und Components (brand/) gehören aber dazu.
  # Builds über einen Build-Hook (Sanity-Webhook beim Veröffentlichen) laufen immer.
  ignore = "[ -z \"$INCOMING_HOOK_TITLE\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../brand ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Staging (main) und Deploy Previews kosten keine Credits: immer bauen.
# Die Ignore-Regel oben vergleicht mit dem zuletzt gebauten Commit; bei main war das nach dem
# Wechsel des Production branch auf live ein falscher Bezug → Build wurde übersprungen (20.10.2026).
[context.branch-deploy]
  ignore = "exit 1"

[context.deploy-preview]
  ignore = "exit 1"

# Dateien unter /_next/static/ und Fonts haben feste Inhalte: ein Jahr im Browser cachen.
# HTML bleibt bei Netlifys Standard (immer frisch prüfen).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sicherheits-Header für alle Seiten.
# CSP: Next.js-Export braucht Inline-Skripte/-Styles ('unsafe-inline'). Calendly ist nur verlinkt.
# img-src cdn.sanity.io: Bilder aus Sanity kommen direkt vom Sanity-CDN (siehe Datenschutz, Abschnitt 4).
# frame-src app.netlify.com: Netlify-Toolbar in Deploy Previews.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.matomo.cloud https://*.matomo.cloud; connect-src 'self' https://*.matomo.cloud; img-src 'self' data: https://cdn.sanity.io https://*.matomo.cloud; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://app.netlify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
